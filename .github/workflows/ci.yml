name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Compile package
        run: python -m compileall -q url2md

      - name: Run tests
        run: python -m pytest -q

      - name: Verify installed CLI
        run: |
          url2md --help >/dev/null
          python - <<'PY'
          import importlib.metadata
          import url2md

          assert importlib.metadata.version("url2md") == url2md.__version__
          print("url2md", url2md.__version__)
          PY
