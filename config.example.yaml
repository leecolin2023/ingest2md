# ingest2md v0.11.0 example configuration

# Local-first transcription. No paid API is required for the default path.
asr_backend: "sensevoice"       # sensevoice | openai | llm
asr_language: "auto"
limit_seconds: 0
subtitle_window_seconds: 300
transcript_window_seconds: 300  # Markdown 阅读窗口；与 ASR chunk 解耦
transcript_enhance: "none"       # none | llm；只校对 Markdown 展示层，不改 raw transcript
transcript_enhance_model: ""     # 留空复用 llm_model

# SenseVoice ONNX. Leave model_dir empty to download iic/SenseVoiceSmall on first use.
sensevoice_model_dir: ""
sensevoice_chunk_seconds: 30
sensevoice_batch_size: 2
sensevoice_quantize: true

# Optional OpenAI-compatible /audio/transcriptions backend.
openai_asr_base_url: "https://api.openai.com/v1"
openai_asr_api_key: ""
openai_asr_model: "gpt-4o-transcribe"
openai_asr_chunk_seconds: 1200
openai_asr_timeout: 600
asr_prompt: ""

# Optional multimodal LLM audio backend.
# Opencode is only the default example; replace base_url/model/key for another compatible provider.
llm_base_url: "https://opencode.ai/zen/go/v1"
llm_api_key: ""
llm_model: "mimo-v2.5"
llm_api: "chat"                # chat | responses
llm_chunk_seconds: 300
llm_candidates: []

output_dir: "output"
formats: ["md"]
max_answers: 0
keep_audio: false
keep_chunks: false

# Retry durability. Downloaded media is cached only to make failed retries cheap.
media_cache_enabled: true
media_cache_dir: ""              # 留空 -> <output>/.cache/media
media_cache_keep_success: false
batch_retry_attempts: 3

cookies_file: ""
youtube_cookies_file: ""
bilibili_cookies_file: ""
zhihu_cookies_file: ""
xiaohongshu_cookies_file: ""
douyin_cookies_file: ""
