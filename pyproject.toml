[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingest2md"
version = "0.10.2"
description = "Source-aware content ingestion for AI/agents: turn web, media and documents into portable Markdown."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4",
  "camoufox",
  "httpx",
  "filelock>=3.12,<4",
  "markdownify",
  "playwright",
  "PyYAML",
  "requests",
  "trafilatura",
  "yt-dlp",
]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.23.2,<2"]
documents = ["markitdown[pdf,docx,pptx,xlsx]"]
# Inference-only; funasr-onnx provides onnxruntime, kaldi-native-fbank,
# scipy, librosa and sentencepiece transitively. Export stacks are excluded.
local-asr = ["funasr-onnx==0.4.3", "modelscope"]

[project.scripts]
ingest2md = "ingest2md.cli:main"

[tool.setuptools.packages.find]
include = ["ingest2md*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
